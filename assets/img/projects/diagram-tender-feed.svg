<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="tender-feed: scrape tender and funding-call pages, keep only new items ranked by energy keywords, and send a weekly email digest">
<title>tender-feed: scrape tender and funding-call pages, keep only new items ranked by energy keywords, and send a weekly email digest</title>

<style>
  .line { stroke: #f3eee2; stroke-opacity: .35; stroke-width: 2; fill: none; }
  .flow { stroke: #5fd4c2; stroke-width: 2.5; fill: none; stroke-dasharray: 6 10;
           stroke-linecap: round; animation: flow 1.6s linear infinite; }
  .lbl  { font: 500 24px 'IBM Plex Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace;
           letter-spacing: .14em; fill: #c9d6d1; }
  .cap  { font: 500 15px 'IBM Plex Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace;
           letter-spacing: .12em; fill: #5fd4c2; }
  .div  { stroke: #f3eee2; stroke-opacity: .3; stroke-width: 1.5; }
  .draw { stroke-dasharray: 100; animation: draw 6s ease-in-out infinite; }
  .rise { animation: rise 3s ease-in infinite; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
  .blink { animation: blink 4.8s ease-in-out infinite; }
  @keyframes flow  { to { stroke-dashoffset: -32; } }
  @keyframes draw  { 0% { stroke-dashoffset: 100; } 55%, 100% { stroke-dashoffset: 0; } }
  @keyframes rise  { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; }
                      100% { transform: translateY(-62px); opacity: 0; } }
  @keyframes pulse { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes blink { 0%, 40% { opacity: 1; } 55%, 85% { opacity: .25; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .flow, .draw, .rise, .pulse, .blink { animation: none; }
    .draw { stroke-dashoffset: 0; }
    .rise { opacity: .8; }
  }
</style>

<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#f3eee2" fill-opacity=".07"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="#5fd4c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>

  <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="#0b6b61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowCream" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1,1 L9,5 L1,9" fill="none" stroke="#f3eee2" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
