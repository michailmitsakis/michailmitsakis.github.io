    Projects:
      - name: catalyst-kg-agent
        url: https://github.com/michailmitsakis/catalyst-kg-agent
        date: "2026"
        summary: Knowledge-graph-grounded multi-agent system for HER catalyst screening under a fixed budget. It decides the cheapest next step (KG lookup, MACE/CGCNN surrogate or expensive verification) using Materials Project data.

      - name: notion-second-brain
        url: https://github.com/michailmitsakis/notion-second-brain
        date: "2026"
        summary: A fully local RAG agent answering queries on my Notion notes; OCR ingestion, hybrid retrieval, cross-encoder reranking, Qdrant DB and a rubric-based eval harness.

      - name: Materials design with ML & AI, DTU
        summary: Gaussian-process prediction of elastic moduli for 3,858 2D materials. Team ranked 3rd of 14 in the course's Kaggle competition.

      - name: Engineering covalently bonded 2D layered materials by self-intercalation for the HER, DTU
        summary: "DFT study of 5 TaS₂ (TMD) bilayers, 0–100% intercalated, for HER. S-on-top was the strongest H-binding site; 75% intercalation as a stability–activity compromise: H binding −2.14 eV, near-zero H₂ binding (spontaneous desorption), moderate stability."

      - name: 3D Pyrolytic Carbon-Gold Electrodes, DTU Nanolab
        summary: Team-based cleanroom work operating multiple experimental setups (spin-coating, baking, development, lithography, pyrolysis, deposition, optical microscopy, SEM, stylus profilometry) towards maximizing the energy efficiency of electrodes for energy-harvesting applications.

      - name: CO₂ electrolysis to formate, DTU Physics
        summary: Investigation of formate utilization in improving fuel-cell energy efficiency. Measured crossover across multiple membranes and electrolytes in H-cell and MEA configurations (CV, HPLC, GC).

      - name: X-Tech Entrepreneurship, DTU
        summary: R&D expert in a startup developing an electrochemical sensor of micro-organic particles towards minimizing crop-yield losses. Cleanroom work, market analysis, progress reports and deliverables under strict deadlines.

      - name: Green fuels & Power-to-X, DTU
        summary: Feasibility study on the optimized production of e-methanol as a maritime fuel, modelled in Aspen Plus.

