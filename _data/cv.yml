    Projects:
      - name: catalyst-kg-agent
        url: https://github.com/michailmitsakis/catalyst-kg-agent
        date: "2026"
        summary: Knowledge-graph-grounded, cost-aware multi-agent system for materials-discovery campaigns.
        highlights:
          - Decides between a knowledge-graph lookup, an MLIP surrogate query (MACE), and an expensive simulated experiment under an explicit budget, as in a self-driving-lab workflow.
          - Materials Project knowledge graph of 189 HER/OER-relevant materials; zero-shot MACE reaches 0.114 eV/atom MAE on non-oxides.
          - CGCNN baseline evaluated with composition-disjoint cross-validation to control polymorph leakage.
          - "Stack: PyTorch Geometric, MACE, BoTorch/Ax, pydantic-ai, Ollama, NetworkX, MLflow."

      - name: notion-second-brain
        url: https://github.com/michailmitsakis/notion-second-brain
        date: "2026"
        summary: Fully local retrieval-augmented agent over a personal Notion workspace.
        highlights:
          - Hybrid dense + BM25 retrieval with reciprocal-rank fusion and cross-encoder reranking.
          - Persistent memory, OCR ingestion of PDFs and images, and an anchored-rubric evaluation harness.
          - "Stack: pydantic-ai, Ollama, Qdrant, Streamlit, Docker."

      - name: CaMEL-RAG — LLM Hackathon for Materials Science & Chemistry
        url: https://github.com/michailmitsakis/CaMEL-RAG
        date: "2025"
        summary: Retrieval-augmented LLM for natural-language queries over Open Catalyst adsorption-energy data (team Code4Catalysis-KFUPM).
        highlights:
          - FAISS vector store over sentence-transformer embeddings; answers cite the retrieved records they are grounded in.
          - Returned stored DFT adsorption energies exactly on 500 in-index test queries (R² = 1.00), validating retrieval and grounding.
          - "Stack: Python, FAISS, sentence-transformers, OpenAI API."

      - name: BayBE one more time — Bayesian Optimization Hackathon for Chemistry and Materials
        url: https://github.com/michailmitsakis/baybe_project-surface-science-syndicate
        date: "2024"
        summary: Bayesian optimisation with BayBE to screen small-molecule corrosion inhibitors for aluminium alloys (team Surface Science Syndicate).
        highlights:
          - Compared one-hot, Mordred, RDKit and Morgan-fingerprint encodings against random search in simulated 50-experiment campaigns (10 Monte Carlo repeats).
          - Transfer learning from AA1000 data reached ~96% inhibition efficiency on AA2024 by the 12th experiment, versus ~89% after 25 without it.
          - "Stack: BayBE, RDKit, Mordred, pandas."

