# Single source for both the /cv/ page and the PDF (rendered by the "Render a CV"
# GitHub Action with RenderCV). Keep to RenderCV's schema — unknown top-level
# fields under `cv:` (e.g. label, summary, address) make the PDF build fail.
# Docs: https://docs.rendercv.com/user_guide/yaml_input_structure/cv/
#
# `date:` accepts free text, so bracketed placeholders are safe here. When you
# have exact dates, you can switch to `start_date: 2023-09` / `end_date: present`.
